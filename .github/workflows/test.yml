name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run pytest
        run: python -m pytest -q
      - name: Run repository integrity script
        run: python tests/test_integrity.py
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Smoke-test command line tools
        run: |
          PYTHONPATH=src python -m hyphenation --help
          python scripts/format_hyphenated.py --help
          python scripts/compare_hyphenated.py --help
