[project]
name = "2025-Edition"
version = "0.1.0"
description = "Texts and metadata for the 2025 edition of The Sacred Harp"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = ["ipython>=9.0.2", "pytest>=8.3.5"]
